<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Class Timetable — Campus OS</title>
  <meta name="description" content="Interactive weekly class timetable, period schedule, and classroom locator for college students on Campus OS." />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="apple-touch-icon" href="img/logo.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .timetable-grid {
      display: grid;
      grid-template-columns: 80px repeat(6, 1fr);
      gap: 8px;
      overflow-x: auto;
    }

    @media (max-width: 900px) {
      .timetable-grid {
        grid-template-columns: 70px repeat(6, minmax(130px, 1fr));
      }
    }

    .tt-header {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .tt-header.today {
      background: rgba(124, 58, 237, 0.15);
      border-color: rgba(124, 58, 237, 0.3);
      color: #c4b5fd;
    }

    .tt-time-slot {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .tt-slot {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      min-height: 80px;
      position: relative;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tt-slot:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }

    .tt-slot.has-class::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
    }

    .tt-slot.violet::before { background: #7c3aed; }
    .tt-slot.cyan::before   { background: #06b6d4; }
    .tt-slot.green::before  { background: #10b981; }
    .tt-slot.amber::before  { background: #f59e0b; }
    .tt-slot.red::before    { background: #ef4444; }
    .tt-slot.pink::before   { background: #ec4899; }
    .tt-slot.blue::before   { background: #3b82f6; }

    .tt-subject {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .tt-code {
      font-size: 11px;
      color: var(--text-muted);
    }

    .tt-room {
      font-size: 10px;
      font-weight: 600;
      color: var(--primary-light);
      margin-top: 4px;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
    }
  </style>
</head>

<body>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="img/logo.png" alt="Campus OS Logo" class="sidebar-logo-img" />
      <div class="sidebar-logo-text">Campus<span class="text-gradient">OS</span></div>
    </div>
    <div class="sidebar-section-label">Navigation</div>
    <a href="index.html" class="sidebar-nav-item"><span class="sidebar-nav-icon">🌐</span>Home Platform</a>
    <a href="profile.html" class="sidebar-nav-item"><span class="sidebar-nav-icon">👤</span>Student Passport</a>
    <div class="sidebar-section-label">Main Workspace</div>
    <a href="dashboard.html" class="sidebar-nav-item" data-page="dashboard"><span class="sidebar-nav-icon">📊</span>Dashboard</a>
    <a href="notes.html" class="sidebar-nav-item" data-page="notes"><span class="sidebar-nav-icon">📝</span>Notes</a>
    <a href="tasks.html" class="sidebar-nav-item" data-page="tasks"><span class="sidebar-nav-icon">✅</span>Tasks</a>
    <div class="sidebar-section-label">Academic</div>
    <a href="timetable.html" class="sidebar-nav-item active" data-page="timetable"><span class="sidebar-nav-icon">📅</span>Timetable</a>
    <a href="attendance.html" class="sidebar-nav-item" data-page="attendance"><span class="sidebar-nav-icon">📈</span>Attendance</a>
    <a href="resources.html" class="sidebar-nav-item" data-page="resources"><span class="sidebar-nav-icon">📚</span>Resources</a>
    <div class="sidebar-footer">
      <a href="profile.html" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;text-decoration:none;color:inherit;">
        <div class="avatar avatar-md" id="sidebar-avatar">?</div>
        <div>
          <div style="font-size:13px;font-weight:600" id="sidebar-name">Loading...</div>
        </div>
      </a>
      <button class="btn btn-ghost btn-sm w-full" id="logout-btn" style="justify-content:flex-start;gap:8px">🚪 Logout</button>
    </div>
  </aside>

  <header class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
    <div style="flex:1"></div>
    <div class="avatar avatar-md" id="topbar-avatar">?</div>
  </header>

  <main class="main-layout">
    <div class="main-content page-transition">
      <div class="page-header animate-fade-in-up">
        <div>
          <div class="page-title">📅 Class Timetable</div>
          <div class="page-subtitle">Interactive weekly schedule grid with today highlighted</div>
        </div>
      </div>

      <!-- Timetable Grid -->
      <div class="timetable-grid animate-fade-in-up delay-100" id="timetable-container">
        <!-- Filled by JS -->
      </div>
    </div>
  </main>

  <!-- Edit Slot Modal -->
  <div class="modal-overlay" id="slot-modal">
    <div class="modal">
      <div class="modal-title">
        <span>Edit Class Slot</span>
        <button class="modal-close" onclick="closeModal('slot-modal')">×</button>
      </div>
      <form id="slot-form" style="display:flex;flex-direction:column;gap:var(--space-4)">
        <input type="hidden" id="slot-day" />
        <input type="hidden" id="slot-time" />
        <div class="form-group">
          <label class="form-label">Subject Name</label>
          <input type="text" id="slot-subject" class="form-input" placeholder="e.g. Operating Systems" />
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)">
          <div class="form-group">
            <label class="form-label">Course Code</label>
            <input type="text" id="slot-code" class="form-input" placeholder="e.g. CS301" />
          </div>
          <div class="form-group">
            <label class="form-label">Room / Lab</label>
            <input type="text" id="slot-room" class="form-input" placeholder="e.g. LH-1 or Lab 3" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Color</label>
          <select id="slot-color" class="form-select">
            <option value="violet">🟣 Violet</option>
            <option value="cyan">🔵 Cyan</option>
            <option value="green">🟢 Green</option>
            <option value="amber">🟡 Amber</option>
            <option value="red">🔴 Red</option>
            <option value="pink">🩷 Pink</option>
            <option value="blue">💙 Blue</option>
          </select>
        </div>
        <div style="display:flex;gap:var(--space-3);justify-content:space-between">
          <button type="button" class="btn btn-danger" id="btn-clear-slot">Clear Slot</button>
          <div style="display:flex;gap:var(--space-2)">
            <button type="button" class="btn btn-ghost" onclick="closeModal('slot-modal')">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Slot</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    var Storage = window.CampusStorage || window.Storage;
    const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const TIME_SLOTS = ['09:00', '10:00', '11:00', '12:00', '14:00', '15:00', '16:00'];

    document.addEventListener('DOMContentLoaded', () => {
      const user = requireAuth();
      if (!user) return;

      const initials = (user.displayName || user.name || 'U').split(' ').map(w => w[0]).join('').substr(0, 2).toUpperCase();
      const photo = Storage.getUserPhoto(user.username || user.handle);
      if (photo) {
        document.getElementById('sidebar-avatar').innerHTML = `<img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
        document.getElementById('topbar-avatar').innerHTML = `<img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
      } else {
        document.getElementById('sidebar-avatar').textContent = initials;
        document.getElementById('topbar-avatar').textContent = initials;
      }
      document.getElementById('sidebar-name').textContent = user.displayName || user.name || 'Student';

      renderTimetable();

      document.getElementById('slot-form').addEventListener('submit', e => {
        e.preventDefault();
        const day = document.getElementById('slot-day').value;
        const time = document.getElementById('slot-time').value;
        const subject = document.getElementById('slot-subject').value.trim();
        const code = document.getElementById('slot-code').value.trim();
        const room = document.getElementById('slot-room').value.trim();
        const color = document.getElementById('slot-color').value;

        if (subject) {
          Storage.setClassSlot(day, time, { subject, code, room, color });
          showToast('Slot updated!', '', 'success');
        } else {
          Storage.clearClassSlot(day, time);
          showToast('Slot cleared', '', 'info');
        }
        closeModal('slot-modal');
        renderTimetable();
      });

      document.getElementById('btn-clear-slot').addEventListener('click', () => {
        const day = document.getElementById('slot-day').value;
        const time = document.getElementById('slot-time').value;
        Storage.clearClassSlot(day, time);
        showToast('Slot cleared', '', 'info');
        closeModal('slot-modal');
        renderTimetable();
      });

      document.getElementById('logout-btn').addEventListener('click', () => { Storage.clearUser(); window.location.href = 'auth.html'; });
      closeModalOnOverlay('slot-modal');
    });

    function renderTimetable() {
      const container = document.getElementById('timetable-container');
      const tt = Storage.getTimetable();
      const today = getTodayName();

      let html = `<div class="tt-header">Time</div>`;
      DAYS.forEach(day => {
        const isToday = day === today;
        html += `<div class="tt-header ${isToday ? 'today' : ''}">${day} ${isToday ? '📍' : ''}</div>`;
      });

      TIME_SLOTS.forEach(time => {
        html += `<div class="tt-time-slot">${time}</div>`;
        DAYS.forEach(day => {
          const cls = tt[day] && tt[day][time];
          if (cls) {
            html += `
              <div class="tt-slot has-class ${cls.color || 'violet'}" onclick="editSlot('${day}', '${time}')">
                <div>
                  <div class="tt-subject">${esc(cls.subject)}</div>
                  <div class="tt-code">${esc(cls.code || '')}</div>
                </div>
                <div class="tt-room">${esc(cls.room || '')}</div>
              </div>`;
          } else {
            html += `<div class="tt-slot empty" onclick="editSlot('${day}', '${time}')"></div>`;
          }
        });
      });

      container.innerHTML = html;
    }

    function editSlot(day, time) {
      const tt = Storage.getTimetable();
      const cls = (tt[day] && tt[day][time]) || {};
      document.getElementById('slot-day').value = day;
      document.getElementById('slot-time').value = time;
      document.getElementById('slot-subject').value = cls.subject || '';
      document.getElementById('slot-code').value = cls.code || '';
      document.getElementById('slot-room').value = cls.room || '';
      document.getElementById('slot-color').value = cls.color || 'violet';
      openModal('slot-modal');
    }
  </script>
</body>

</html>
