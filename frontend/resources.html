<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Resources & PYQ Vault — Campus OS</title>
  <meta name="description" content="Verified PYQs, lab manuals, and study links for college students on Campus OS." />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="apple-touch-icon" href="img/logo.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .res-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-5);
    }

    @media (max-width: 768px) {
      .res-grid {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: var(--space-4);
      }
    }

    @media (max-width: 480px) {
      .res-grid {
        grid-template-columns: 1fr;
        gap: var(--space-3);
      }
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
    }
  </style>
</head>

<body>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="img/logo.png" alt="Campus OS Logo" class="sidebar-logo-img" />
      <div class="sidebar-logo-text">Campus<span class="text-gradient">OS</span></div>
    </div>
    <div class="sidebar-section-label">Navigation</div>
    <a href="index.html" class="sidebar-nav-item"><span class="sidebar-nav-icon">🌐</span>Home Platform</a>
    <a href="profile.html" class="sidebar-nav-item"><span class="sidebar-nav-icon">👤</span>Student Passport</a>
    <div class="sidebar-section-label">Main Workspace</div>
    <a href="dashboard.html" class="sidebar-nav-item" data-page="dashboard"><span class="sidebar-nav-icon">📊</span>Dashboard</a>
    <a href="notes.html" class="sidebar-nav-item" data-page="notes"><span class="sidebar-nav-icon">📝</span>Notes</a>
    <a href="tasks.html" class="sidebar-nav-item" data-page="tasks"><span class="sidebar-nav-icon">✅</span>Tasks</a>
    <div class="sidebar-section-label">Academic</div>
    <a href="timetable.html" class="sidebar-nav-item" data-page="timetable"><span class="sidebar-nav-icon">📅</span>Timetable</a>
    <a href="attendance.html" class="sidebar-nav-item" data-page="attendance"><span class="sidebar-nav-icon">📈</span>Attendance</a>
    <a href="resources.html" class="sidebar-nav-item active" data-page="resources"><span class="sidebar-nav-icon">📚</span>Resources</a>
    <div class="sidebar-footer">
      <a href="profile.html" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;text-decoration:none;color:inherit;">
        <div class="avatar avatar-md" id="sidebar-avatar">?</div>
        <div>
          <div style="font-size:13px;font-weight:600" id="sidebar-name">Loading...</div>
        </div>
      </a>
      <button class="btn btn-ghost btn-sm w-full" id="logout-btn" style="justify-content:flex-start;gap:8px">🚪 Logout</button>
    </div>
  </aside>

  <header class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
    <div style="flex:1"></div>
    <div class="avatar avatar-md" id="topbar-avatar">?</div>
  </header>

  <main class="main-layout">
    <div class="main-content page-transition">
      <div class="page-header animate-fade-in-up">
        <div>
          <div class="page-title">📚 Study Resource Hub</div>
          <div class="page-subtitle">Verified lecture materials, PYQs, and recommended reference links</div>
        </div>
        <button class="btn btn-primary" id="add-res-btn">+ Add Resource</button>
      </div>

      <!-- Search & Filters -->
      <div style="display:flex;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap">
        <div class="search-bar" style="flex:1;min-width:260px">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-resources" placeholder="Search by title, subject, or category..." />
        </div>
      </div>

      <!-- Resources Grid -->
      <div class="res-grid animate-fade-in-up delay-100" id="resources-container">
        <!-- Filled by JS -->
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="res-modal">
    <div class="modal">
      <div class="modal-title">
        <span>Add Study Resource</span>
        <button class="modal-close" onclick="closeModal('res-modal')">×</button>
      </div>
      <form id="res-form" style="display:flex;flex-direction:column;gap:var(--space-4)">
        <div class="form-group">
          <label class="form-label">Resource Title *</label>
          <input type="text" id="res-title" class="form-input" placeholder="e.g. MIT OpenCourseWare — Operating Systems" required />
        </div>
        <div class="form-group">
          <label class="form-label">URL / Link *</label>
          <input type="url" id="res-url" class="form-input" placeholder="https://..." required />
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="res-category" class="form-select">
              <option value="Lecture Notes">Lecture Notes</option>
              <option value="PYQ">PYQ / Exam Paper</option>
              <option value="Lab Manual">Lab Manual</option>
              <option value="Tutorial">Video Tutorial</option>
              <option value="Reference">Reference</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Subject</label>
            <input type="text" id="res-subject" class="form-input" placeholder="e.g. OS, DBMS, DS" />
          </div>
        </div>
        <div style="display:flex;gap:var(--space-3);justify-content:flex-end">
          <button type="button" class="btn btn-ghost" onclick="closeModal('res-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Resource</button>
        </div>
      </form>
    </div>
  </div>

  <div class="fab" id="fab-res" title="Add Resource">+</div>
  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    var Storage = window.CampusStorage || window.Storage;
    document.addEventListener('DOMContentLoaded', () => {
      const user = requireAuth();
      if (!user) return;

      const initials = (user.displayName || user.name || 'U').split(' ').map(w => w[0]).join('').substr(0, 2).toUpperCase();
      const photo = Storage.getUserPhoto(user.username || user.handle);
      if (photo) {
        document.getElementById('sidebar-avatar').innerHTML = `<img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
        document.getElementById('topbar-avatar').innerHTML = `<img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
      } else {
        document.getElementById('sidebar-avatar').textContent = initials;
        document.getElementById('topbar-avatar').textContent = initials;
      }
      document.getElementById('sidebar-name').textContent = user.displayName || user.name || 'Student';

      renderResources();

      document.getElementById('search-resources').addEventListener('input', e => renderResources(e.target.value));

      const openAdd = () => {
        document.getElementById('res-form').reset();
        openModal('res-modal');
      };
      document.getElementById('add-res-btn').addEventListener('click', openAdd);
      document.getElementById('fab-res').addEventListener('click', openAdd);

      document.getElementById('res-form').addEventListener('submit', async e => {
        e.preventDefault();
        const title = document.getElementById('res-title').value.trim();
        const url = document.getElementById('res-url').value.trim();
        let category = document.getElementById('res-category').value;
        let subject = document.getElementById('res-subject').value.trim();

        if (!title || !url) return;

        // Call Python AI categorizer
        const catRes = await window.PythonAPI.categorizeResource(title);
        const emoji = catRes.emoji || '📚';
        if (!subject && catRes.suggested_subject) subject = catRes.suggested_subject;

        Storage.addResource({ title, url, category, subject: subject || 'General', emoji });
        showToast('Resource added!', '', 'success');
        closeModal('res-modal');
        renderResources();
      });

      document.getElementById('logout-btn').addEventListener('click', () => { Storage.clearUser(); window.location.href = 'auth.html'; });
      closeModalOnOverlay('res-modal');
    });

    function renderResources(filterQuery = '') {
      const list = Storage.getResources();
      const container = document.getElementById('resources-container');
      const query = filterQuery.toLowerCase().trim();

      const filtered = list.filter(r => {
        if (!query) return true;
        return (r.title || '').toLowerCase().includes(query) ||
               (r.subject || '').toLowerCase().includes(query) ||
               (r.category || '').toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">📚</div><div class="empty-state-title">No resources found</div></div>`;
        return;
      }

      container.innerHTML = filtered.map(r => `
        <div class="resource-card animate-fade-in">
          <div class="resource-favicon">${r.emoji || '📚'}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</div>
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">
              <span class="badge badge-info">${esc(r.category || 'Reference')}</span>
              ${r.subject ? `<span class="badge badge-primary">${esc(r.subject)}</span>` : ''}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <a href="${esc(r.url)}" target="_blank" class="btn btn-secondary btn-sm" style="color:var(--primary-light)">Open Link ↗</a>
              <button class="btn btn-ghost btn-sm" onclick="removeRes('${r.id}')" title="Delete">🗑</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function removeRes(id) {
      if (confirm('Delete this resource?')) {
        Storage.deleteResource(id);
        renderResources();
        showToast('Resource deleted', '', 'info');
      }
    }
  </script>
</body>

</html>
